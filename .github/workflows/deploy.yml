name: deploy

# Builds the image and records its tag in the platform repository: a push to
# `dev` deploys it to DEV, a push to `main` releases it to UAT and, after a
# manual Sync, PRD (branch_model below, decided 2 Oct 2026).
# Image: ghcr.io/eu-farmbook/deepl-translation:<short sha>, from the Dockerfile
# at the repository root.
on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  deploy:
    # Required: the default workflow token is read-only, and a called workflow
    # cannot be granted more than its caller holds.
    permissions:
      contents: read
      packages: write
    uses: EU-FarmBook/ci-workflows/.github/workflows/build-and-deploy.yml@v1
    with:
      service: deepl-translation
      branch_model: dev-main
    secrets:
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
