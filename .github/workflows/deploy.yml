name: deploy

# Builds ghcr.io/eu-farmbook/deepl-translation from the root Dockerfile.
on:
  push:
    # dev deploys to DEV; main is released to UAT and PRD.
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  deploy:
    # packages: write lets the reusable workflow push the image to GHCR.
    permissions:
      contents: read
      packages: write
    uses: EU-FarmBook/ci-workflows/.github/workflows/build-and-deploy.yml@v1
    with:
      service: deepl-translation
      branch_model: dev-main
    secrets:
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
